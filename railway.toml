[build]
builder = "nixpacks"

[deploy]
startCommand = "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180"
healthcheckPath = "/health"
healthcheckTimeout = 300

[[services]]
name = "web"

[[services.env]]
name = "SECRET_KEY"
value = "too-easy-production-static-secret-key-2026-change-me-via-railway-service-vars"

[[services.env]]
name = "UPLOAD_FOLDER"
value = "/app/uploads"

[[services.env]]
name = "WEB_CONCURRENCY"
value = "1"

[[services.env]]
name = "MAX_WORKERS"
value = "1"
